name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rapidresq:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RapidResQ-Final

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            RapidResQ-Final/backend/package-lock.json
            RapidResQ-Final/web/package-lock.json

      - name: Validate vercel.json
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json OK');"

      - name: Backend install + API smoke load
        run: |
          npm ci --prefix backend
          node -e "require('./backend/index.js'); console.log('main API OK')"
          node -e "require('./api/signup.js'); console.log('signup fn OK')"
          node -e "require('./api/login.js'); console.log('login fn OK')"

      - name: Web build
        env:
          CI: "false"
        run: npm ci --prefix web && npm run build --prefix web
